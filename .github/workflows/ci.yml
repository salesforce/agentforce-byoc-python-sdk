name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry "poetry-dynamic-versioning>=1.0.0,<2.0.0"
      - name: Install dependencies
        run: poetry install --with dev,test --no-interaction
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry "poetry-dynamic-versioning>=1.0.0,<2.0.0"
      - name: Install dependencies
        run: poetry install --with dev,test --no-interaction
      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so poetry-dynamic-versioning can resolve the version.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry "poetry-dynamic-versioning>=1.0.0,<2.0.0"
      - name: Build
        run: make package
      - name: Verify template package-data ships in the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          echo "Inspecting ${wheel}"
          contents="$(python -m zipfile -l "${wheel}")"
          echo "${contents}"
          missing=0
          for tmpl in \
            "agentforce_byoc/templates/agent/.dockerignore.template" \
            "agentforce_byoc/templates/agent/.gitignore.template" \
            "agentforce_byoc/templates/agent/.python-version.template" \
            "agentforce_byoc/templates/agent/Dockerfile.template" \
            "agentforce_byoc/templates/agent/Makefile.template" \
            "agentforce_byoc/templates/agent/README.md.template" \
            "agentforce_byoc/templates/agent/config.json.template" \
            "agentforce_byoc/templates/agent/entry_func.py.template" \
            "agentforce_byoc/templates/agent/main.py.template" \
            "agentforce_byoc/templates/agent/pyproject.toml.template" \
            "agentforce_byoc/templates/agent/schema.py.template"; do
            if ! printf '%s\n' "${contents}" | grep -qF "${tmpl}"; then
              echo "::error::Missing template in wheel: ${tmpl}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Wheel is missing template package-data; failing build."
            exit 1
          fi
          echo "All 11 template files are present in the wheel."
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
